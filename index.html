<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Offer Copilot: an AI copilot that helps merchants plan, fund, run and measure checkout offers.">
<title>Offer Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0}body{min-height:100vh}[hidden]{display:none!important}
/* Layout: merchant dashboard shell. Fixed left nav + top bar + working canvas. Blue accent on cool neutrals. */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --surface2:#F6F8FC; --ink:#0D1B33; --muted:#5B6B84; --line:#DEE4EE;
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent-soft:#E6EEFE; --navy:#0B1D3A;
  --good:#0A7F4F; --good-soft:#DDF3E8; --warn:#A85A00; --warn-soft:#FDEFD9; --bad:#BF2F2A; --bad-soft:#FBE3E1;
  --bank:#7A3E9D; --bank-soft:#F1E7F8; --chart2:#A3B0C3;
  --ui:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#111C2F; --surface2:#16233A; --ink:#E7EDF6; --muted:#97A6BD; --line:#24344F;
  --accent:#5B93FF; --accent-ink:#06101F; --accent-soft:#17305C; --navy:#050C18;
  --good:#3CC48A; --good-soft:#0F3527; --warn:#F0A44A; --warn-soft:#3A2810; --bad:#FF7A72; --bad-soft:#3E1A19;
  --bank:#C99AE6; --bank-soft:#2E1A3B; --chart2:#5A6B86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111C2F; --surface2:#16233A; --ink:#E7EDF6; --muted:#97A6BD; --line:#24344F;
  --accent:#5B93FF; --accent-ink:#06101F; --accent-soft:#17305C; --navy:#050C18;
  --good:#3CC48A; --good-soft:#0F3527; --warn:#F0A44A; --warn-soft:#3A2810; --bad:#FF7A72; --bad-soft:#3E1A19;
  --bank:#C99AE6; --bank-soft:#2E1A3B; --chart2:#5A6B86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.3px;padding:4px 10px 14px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:13px}
.acct{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;gap:9px;align-items:center;margin-bottom:14px}
.acct span.av{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:11px}
.acct b{display:block;font-size:12px}.acct small{color:var(--muted);font-size:11px}
.navlbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 12px 6px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .ic{width:18px;text-align:center}
.nav .new{margin-left:auto;font-size:10px;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:99px}
.sidefoot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 12px;display:grid;gap:6px}
.sidefoot button{border:0;background:none;padding:0;text-align:left;color:var(--accent);font-weight:600;font-size:11px}
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}
.search{margin-left:auto;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted);width:min(300px,30vw)}
.tag{font-size:11px;font-weight:700;border:1px dashed var(--line);color:var(--muted);border-radius:6px;padding:4px 8px;white-space:nowrap}
.me{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.menu{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.wrap{padding:22px 24px 60px;max-width:1280px;width:100%;margin:0 auto;display:grid;gap:16px;align-content:start}
/* common */
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.head h1{font-size:24px;letter-spacing:-.5px;line-height:1.2}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:680px}
.back{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:0;margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font-size:15px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:12px;margin:3px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bankb{background:var(--bank);border-color:var(--bank);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.ai{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.blue{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.bank{background:var(--bank-soft);color:var(--bank);border-color:transparent}
.big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.mid{font-size:22px;font-weight:800;letter-spacing:-.5px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi{padding:14px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:0 0 10px;font-weight:600;font-size:13px;color:var(--muted);position:relative;white-space:nowrap}
.tabs button.on{color:var(--accent)}
.tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.tabs .cnt{font-size:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 6px;margin-left:4px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);text-transform:uppercase;letter-spacing:.04em}
td{padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
/* AI strip */
.aistrip{background:var(--navy);color:#fff;border-radius:12px;padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.aistrip .spark{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:800}
.aistrip p{margin:2px 0 0;opacity:.8;font-size:13px}
.aistrip .btn{margin-left:auto}
/* opportunity */
.opp{display:grid;gap:12px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);align-content:start}
.opp h3{font-size:15px;line-height:1.35}
.why{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.why div{display:grid;grid-template-columns:14px 1fr;gap:6px}
.why div:before{content:"›";color:var(--accent);font-weight:800}
details summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--accent)}
.linkbtn{font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;padding:0}
/* plans */
.opt{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;background:var(--surface);align-content:start}
.opt.pick{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.terms{font-size:15px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12px}
.kv span{color:var(--muted)}.kv b{text-align:right}
.meter{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--warn)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs>div{border-radius:10px;padding:14px;background:var(--surface2);border:1px solid var(--line)}
.vs .ai{background:var(--accent-soft);border-color:transparent}
/* editor */
.form{display:grid;gap:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700}
.field small{font-size:11px;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.segc button{border:0;background:var(--surface);padding:8px 12px;font-size:12px;font-weight:600}
.segc button.on{background:var(--accent);color:var(--accent-ink)}
.fund{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fund button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;text-align:left;display:grid;gap:3px}
.fund button b{font-size:13px}.fund button small{font-size:11px;color:var(--muted)}
.fund button.on{border-color:var(--accent);background:var(--accent-soft)}
.fund button.on.bk{border-color:var(--bank);background:var(--bank-soft)}
.slider{display:grid;gap:3px}
.slider .t2{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.slider output{font-family:var(--mono);color:var(--accent)}
.slider small{font-size:11px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.sect{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px}
.sect h3{font-size:13px}
.toggle{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.toggle input{width:17px;height:17px;accent-color:var(--accent);margin-top:2px}
.toggle b{font-size:13px;display:block}.toggle small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.chip:hover{background:var(--accent-soft)}
.impact{position:sticky;top:74px;display:grid;gap:12px;align-content:start}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:16px}
.hero .lbl{color:#ffffffaa}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:8px 0 6px}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini>div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px}
.note{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.bad{background:var(--bad-soft);border-color:transparent}
.note.good{background:var(--good-soft);border-color:transparent}
.note.bank{background:var(--bank-soft);border-color:transparent}
.note i{font-style:normal;font-weight:800}
.note .act{margin-top:6px}
.footbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:3;margin:0 -24px -60px}
svg text{fill:var(--muted);font-size:11px;font-family:var(--ui)}
/* bank tracker */
.track{display:grid;gap:0}
.tstep{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tstep:not(:last-child):after{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tstep .d{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);z-index:1}
.tstep.done .d{background:var(--good);border-color:var(--good);color:#fff}
.tstep.now .d{background:var(--bank);border-color:var(--bank);color:#fff}
.tstep.fail .d{background:var(--bad);border-color:var(--bad);color:#fff}
.tstep b{font-size:13px;display:block}.tstep small{font-size:12px;color:var(--muted)}
.demo{border:1.5px dashed var(--line);border-radius:12px;padding:14px;background:var(--surface2)}
.demo .lbl{margin-bottom:8px}
.counter{border:2px solid var(--bank);border-radius:12px;padding:16px;background:var(--bank-soft);display:grid;gap:10px}
/* live */
.status{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;font-weight:700;font-size:13px}
.status.live{background:var(--good-soft);color:var(--good)}
.status.paused{background:var(--warn-soft);color:var(--warn)}
.status.sched{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.nudge{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.nudge.dn{opacity:.6}
.nudge h3{font-size:14px}.nudge p{margin:0;font-size:13px;color:var(--muted)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr 80px;gap:10px;align-items:center;font-size:12px}
.bt{height:14px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent)}
.bt i.g{background:var(--chart2)}
.learn{display:grid;gap:10px}
.learn div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;align-items:start}
/* modal */
.modalbg{position:fixed;inset:0;background:#06101fb3;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
.modal h2{font-size:18px}
.opts{display:grid;gap:8px}
.opts label{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;font-size:13px}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opts input{accent-color:var(--accent)}
.opts small{color:var(--muted);display:block;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;transition:.2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:30px}
@media (max-width:1050px){.g3,.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.impact{position:static}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;z-index:15;width:250px;transform:translateX(-105%);transition:.2s}.side.open{transform:none;box-shadow:0 0 0 100vmax #06101f88}.menu{display:block}.search{display:none}.topbar{padding:0 16px}.wrap{padding:18px 16px 60px}.footbar{margin:0 -16px -60px;padding-left:16px;padding-right:16px}}
@media (max-width:560px){.fgrid,.fund,.vs,.mini{grid-template-columns:1fr}.big{font-size:27px}.head h1{font-size:21px}.barrow{grid-template-columns:80px 1fr 64px}.tag{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
 <aside class="side" id="side">
  <div class="brand"><i>₹</i>Payments</div>
  <div class="acct"><span class="av">NH</span><span><b>Nivara Home</b><small>Home linen · D2C</small></span></div>
  <div class="navlbl">Accept payments</div>
  <nav class="nav" id="nav"></nav>
  <div class="sidefoot"><span>Concept prototype · sample data</span><button onclick="resetDemo()">Reset demo data</button></div>
 </aside>
 <div style="min-width:0;display:flex;flex-direction:column">
  <header class="topbar"><button class="menu" onclick="$('#side').classList.toggle('open')" aria-label="Menu">☰</button><div class="crumb" id="crumb"></div><div class="search">Search payments, offers, customers</div><span class="tag">Sample data</span><span class="me">AS</span></header>
  <div class="wrap" id="main"></div>
 </div>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- data ---------- */
const SEG={
 festive:{issuer:'Kotak Mahindra Bank',bshort:'Kotak',card:'Credit cards',name:'Kotak credit card buyers',perDay:9.1,aov:2250,elastic:4,days:7,start:'2026-11-01',conf:'Medium',vol:'₹12.8L',
  title:'Kotak cardholders are your biggest Diwali spenders, and 1 in 3 leave at checkout',
  signals:['Kotak cards are 28% of your card volume (₹12.8L in 12 months)','Last Diwali: 64 Kotak orders at a ₹2,250 average basket','31% of Kotak checkouts in festive weeks ended unpaid','Kotak buyers redeemed 2 of your past card offers'],
  presets:{careful:{type:'pct',value:4,cap:100,min:3000,maxUses:40},balanced:{type:'pct',value:5,cap:150,min:2500,maxUses:60},bold:{type:'pct',value:10,cap:300,min:2000,maxUses:120}}},
 basket:{issuer:'All cards and UPI',bshort:'',card:'All methods',name:'All buyers',perDay:22,aov:1750,elastic:3.2,days:10,start:'2026-10-20',conf:'High',vol:'₹38.4L',
  title:'Carts keep stalling just under ₹2,000',
  signals:['41% of orders land between ₹1,500 and ₹1,999','Average basket is ₹1,750, a bedsheet set is ₹2,199','Orders with 2+ items get refunded 22% less','No basket-size offer has run in 6 months'],
  presets:{careful:{type:'flat',value:100,cap:100,min:2000,maxUses:120},balanced:{type:'flat',value:150,cap:150,min:2200,maxUses:150},bold:{type:'pct',value:10,cap:250,min:1500,maxUses:300}}},
 winback:{issuer:'All cards and UPI',bshort:'',card:'Saved cards',name:'Lapsed repeat buyers',perDay:1.2,aov:2100,elastic:9,days:14,start:'2026-10-22',conf:'Low',vol:'₹4.5L',

/* Model: buyers who'd come anyway, buyers the offer creates, buyers who climb to the minimum, fatigue. */
function sim(p,seg,share=1){
  const D=p.days, base=seg.perDay*D, avgQ=Math.max(p.min,seg.aov)*1.08;
  const per=p.type==='flat'?Math.min(p.value,p.cap):Math.min(p.cap,avgQ*p.value/100), eff=per/avgQ;
  const q=1/(1+Math.exp((p.min-seg.aov)/(seg.aov*.2)));
  const fat=D<=7?1:Math.max(.55,1-(D-7)*.035);
  const nw=base*Math.max(0,eff-.015)*seg.elastic*fat;
  const climb=p.min>seg.aov?Math.max(0,1-(p.min-seg.aov)/(seg.aov*.6)):0;
  const up=base*(1-q)*.22*climb*Math.min(1,eff/.04);
  const any=base*q,tot=any+nw+up,red=Math.min(p.maxUses,tot),sc=tot?red/tot:0;
  const total=red*per,cost=total*share,bankCost=total-cost;
  const gain=(nw*avgQ*MARGIN+up*Math.max(0,p.min-seg.aov*.85)*MARGIN)*sc;
  return {D,base,per,eff,any:any*sc,nw:nw*sc,up:up*sc,red,total,cost,bankCost,profit:gain-cost,lo:gain*.7-cost,hi:gain*1.3-cost,
   leak:red?any*sc/red:0,inc:(nw+up)*sc,roi:cost?(gain-cost)/cost:0,capDay:tot>p.maxUses?Math.max(1,Math.round(p.maxUses/(tot/D))):null,avgQ};
}

 save();offer()}
function acceptCounter(id){const o=S.offers.find(x=>x.id===id),c=o.req.counter;o.p.min=c.min;o.p.cap=c.cap;if(o.p.type==='flat')o.p.value=Math.min(o.p.value,c.cap);o.fund={mode:'shared',bank:c.bank};o.req.result='approved';o.req.hist.push(['You accepted '+bankShort(o)+'\'s terms','16 Oct, 11:20 AM']);o.status='Scheduled';o.guard.budget=autoBudget(o);save();offer();toast('Accepted. Offer scheduled on the approved terms.')}
function rejectCounter(id){const o=S.offers.find(x=>x.id===id);o.req.result='declined';o.req.hist.push(['You declined the counter','16 Oct, 11:20 AM']);o.status='Bank declined';save();offer()}
function runSelf(id){const o=S.offers.find(x=>x.id===id);o.fund={mode:'me',bank:0};o.req.hist.push(['Switched to paid by you','16 Oct, 11:30 AM']);o.status='Scheduled';o.guard.budget=autoBudget(o);save();offer();toast('Scheduled, paid by you')}
function startNow(id){const o=S.offers.find(x=>x.id===id);o.status='Live';o.live.day=Math.min(4,o.p.days);save();offer()}

/* live */
function liveView(o){const r=simO(o),f=r.red/r.D,mult=[1.5,2.1,1.9,2.2],day=o.live.day,bs=bankShort(o);
 const act=[...Array(day)].map((_,i)=>Math.round(f*mult[i%4])),done=act.reduce((a,b)=>a+b,0),spent=Math.min(o.guard.budget,done*r.per*myShare(o)),nm=Math.round(o.p.min*1.2/100)*100,pl=Math.round(f*day);
 const N=[{id:'hot',lvl:'warn',tag:'Budget',t:`Running ${(done/Math.max(1,pl)).toFixed(1)}x faster than planned`,d:`${done} redemptions vs ${pl} expected. 64% are orders that were already above ${R(o.p.min)}. Raising the minimum to ${R(nm)} keeps the offer for bigger baskets and makes the budget last.`,a:'Raise minimum to '+R(nm)},
  {id:'card',lvl:'bad',tag:'Risk',t:'One card used 5 times in 40 minutes',d:'Card ending 4417 placed 5 orders of ₹2,510 to the same pincode. Your one-per-day rule held 4 of the discounts. Block this card from offers?',a:'Block card'},
  {id:'axis',lvl:'blue',tag:'Idea',t:'Axis cardholders are browsing more',d:'Axis checkouts are up 38% this week at a ₹2,900 average basket. Want a draft for a small Axis test next week?',a:'Draft Axis test'}];
 const shown=Math.min(r.D,7),mx=Math.max(...act,f)*1.15;
 return `<div class="status ${o.live.paused?'paused':'live'}"><span class="dot"></span>${o.live.paused?'Paused · customers don\'t see the offer':'Live · day '+day+' of '+r.D}<span class="sp"></span><button class="btn sm" onclick="togglePause('${o.id}')">${o.live.paused?'Resume':'Pause offer'}</button><button class="btn sm" onclick="endNow('${o.id}')">End and see results</button></div>
 <div class="g4"><div class="card kpi"><div class="lbl">Redemptions</div><div class="mid num">${done}</div><div class="sub">Plan by today: ${pl}</div></div>
  <div class="card kpi"><div class="lbl">Your budget used</div><div class="mid num">${K(spent)}</div><div class="meter" style="margin-top:6px"><i style="width:${Math.min(100,spent/o.guard.budget*100)}%;background:var(--accent)"></i></div><div class="sub">of ${R(o.guard.budget)}${o.fund.mode!=='me'?' · '+bs+' paid '+K(done*r.per*(1-myShare(o))):''}</div></div>
  <div class="card kpi"><div class="lbl">Offer vs holdout</div><div class="mid num" style="color:var(--good)">${o.guard.holdout?'+18%':'n/a'}</div><div class="sub">${o.guard.holdout?'Conversion, early read':'Holdout is off'}</div></div>
  <div class="card kpi"><div class="lbl">Held for review</div><div class="mid num">4</div><div class="sub">By your card rule</div></div></div>
 <div class="g2"><div class="card"><h2>Daily redemptions vs plan</h2><div class="legend" style="margin-top:6px"><span style="--c:var(--accent)">Actual</span><span style="--c:var(--chart2)">Plan</span></div>
  <div class="bars" style="margin-top:12px">${[...Array(shown)].map((_,j)=>{const i=day>shown?day-shown+j:j,a=i<day?act[i]:null;return `<div class="barrow"><span>Day ${i+1}${i===day-1?' · today':''}</span><div style="display:grid;gap:3px"><div class="bt"><i class="g" style="width:${f/mx*100}%"></i></div>${a!==null?`<div class="bt"><i style="width:${a/mx*100}%"></i></div>`:''}</div><span class="num">${a!==null?a+' / '+Math.round(f):'plan '+Math.round(f)}</span></div>`}).join('')}</div></div>
  <div style="display:grid;gap:12px;align-content:start;min-width:0"><h2>Needs your call</h2>
  ${N.map(n=>{const st=o.live.nudges[n.id];return `<div class="nudge ${st?'dn':''}"><div class="row"><span class="pill ${n.lvl}">${n.tag}</span>${st?`<span class="pill good">${st}</span>`:''}</div><h3>${n.t}</h3><p>${n.d}</p>${st?'':`<div class="row"><button class="btn pri sm" onclick="nud('${o.id}','${n.id}','Done')">${n.a}</button><button class="btn sm" onclick="${n.id==='hot'?`editExisting('${o.id}')`:`nud('${o.id}','${n.id}','Edited')`}">Change</button><button class="btn sm" onclick="nud('${o.id}','${n.id}','Ignored')">Ignore</button></div>`}</div>`}).join('')}</div></div>`}
function togglePause(id){const o=S.offers.find(x=>x.id===id);o.live.paused=!o.live.paused;o.status=o.live.paused?'Paused':'Live';save();offer();toast(o.live.paused?'Paused':'Resumed')}
function nud(id,n,st){const o=S.offers.find(x=>x.id===id);o.live.nudges[n]=st;if(n==='hot'&&st==='Done'){o.p.min=Math.round(o.p.min*1.2/100)*100}if(n==='axis'&&st==='Done'){newFrom('festive','careful');S.draft.issuer='Axis Bank';S.draft.name='Axis cards · small test';save();return}save();offer();toast(st==='Ignored'?'Ignored. The copilot will weigh this less next time.':'Done. Logged in offer history.')}
function endNow(id){const o=S.offers.find(x=>x.id===id);o.status='Ended';save();offer()}

/* results */
function result(o){const r=simO(o),act=Math.round(r.inc*1.12),hold=3.9,lift=Math.max(5,Math.round(act/(r.base||1)*100));return {r,act,prof:r.profit*1.1,hold,off:+(hold*(1+lift/100)).toFixed(1),lift}}
function resultView(o){const x=result(o),r=x.r,s=SEG[o.opp];
 return `<div class="card" style="background:var(--navy);color:#fff;border:0"><div class="lbl" style="color:#ffffffaa">Real extra profit, measured against the holdout</div><div class="big num">${x.prof>0?'+':''}${K(x.prof)}</div><div style="opacity:.8;font-size:13px">${x.act} orders happened because of the offer. The plan said ${Math.round(r.inc)}.</div></div>
 <div class="g4"><div class="card kpi"><div class="lbl">Redemptions</div><div class="mid num">${Math.round(r.red)}</div><div class="sub">${Math.round(r.any)} would have bought anyway</div></div>
  <div class="card kpi"><div class="lbl">Discount, your share</div><div class="mid num">${K(r.cost)}</div><div class="sub">${r.bankCost>0?bankShort(o)+' paid '+K(r.bankCost):'Paid by you'}</div></div>
  <div class="card kpi"><div class="lbl">Conversion lift</div><div class="mid num" style="color:var(--good)">+${x.lift}%</div><div class="sub">${x.off}% vs ${x.hold}% holdout</div></div>
  <div class="card kpi"><div class="lbl">Abuse stopped</div><div class="mid num">${K(4*r.per)}</div><div class="sub">4 discounts held</div></div></div>
 <div class="g2"><div class="card"><h2>Offer group vs holdout</h2><p class="sub">Same customers, same dates. Only difference is the offer.</p>
  <div class="bars" style="margin-top:12px"><div class="barrow"><span>Saw the offer</span><div class="bt"><i style="width:${x.off/7*100}%"></i></div><b class="num">${x.off}%</b></div><div class="barrow"><span>Holdout</span><div class="bt"><i class="g" style="width:${x.hold/7*100}%"></i></div><b class="num">${x.hold}%</b></div>
  <div class="barrow"><span>Basket, offer</span><div class="bt"><i style="width:${r.avgQ/4000*100}%"></i></div><b class="num">${K(r.avgQ)}</b></div><div class="barrow"><span>Basket, holdout</span><div class="bt"><i class="g" style="width:${s.aov/4000*100}%"></i></div><b class="num">${K(s.aov)}</b></div></div></div>
  <div class="card"><h2>What the copilot learned</h2><div class="learn" style="margin-top:12px">
   <div><span class="pill good">Up</span><span>${o.issuer.split(' ')[0]} buyers respond to a minimum just above their usual basket. Future suggestions start there.</span></div>
   <div><span class="pill warn">Down</span><span>The first days ran hot on sure buyers. Next plan starts with a higher minimum.</span></div>
   ${o.req?`<div><span class="pill bank">Bank</span><span>${bankShort(o)} ${o.req.result==='approved'?'co-funded this one. Its approval data strengthens your next request.':'did not fund this one. Next request goes earlier.'}</span></div>`:''}
   <div><span class="pill">You</span><span>Your accept and ignore choices tune how often the copilot speaks up.</span></div></div>
   <div class="row" style="margin-top:14px"><button class="btn pri" onclick="repeatO('${o.id}')">Repeat with learnings</button><button class="btn" onclick="toast('Okay. No follow-up planned.')">Stop here</button></div></div></div>`}
function repeatO(id){const o=S.offers.find(x=>x.id===id);S.draft=Object.assign(clone(o),{id:'o'+(++S.seq),name:o.name.split(' · ')[0]+' again · '+o.name.split(' · ')[1],status:'Draft',req:null,live:{day:0,paused:false,nudges:{}},start:'2026-12-20',log:['Minimum raised 10% based on last results'],plan:null});S.draft.p.min=Math.round(o.p.min*1.1/100)*100;nav('editor')}

if(S.view==='editor'&&!S.draft)S.view='offers';
render();
</script>

</body>
</html>
